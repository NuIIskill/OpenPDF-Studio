<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- App logo: blue rounded square + white "O" mark.
       The O is pure geometry, not <text> — the icon is rasterized by NanoSVG
       (src/3rdparty/nanosvg), which has no text support, and a font-based
       glyph would render differently on every machine anyway. Two concentric
       ellipses with fill-rule="evenodd" punch the counter: outer 97x106,
       inner 51x70, giving 23px side stems and 18px top/bottom. -->
  <rect width="256" height="256" rx="56" ry="56" fill="#2563EB"/>
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M79.5 128 A48.5 53 0 1 1 176.5 128 A48.5 53 0 1 1 79.5 128 Z
           M102.5 128 A25.5 35 0 1 1 153.5 128 A25.5 35 0 1 1 102.5 128 Z"/>
</svg>
